name: Reference code checks
on:
  push:
    paths: ["code/**", ".github/workflows/reference-code.yml"]
  pull_request:
    paths: ["code/**", ".github/workflows/reference-code.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  component-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: code
    env:
      JAX_PLATFORM_NAME: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: code/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e '.[dev,video]'
      - name: Compile reference programs
        run: python -m compileall -q relax scripts tests
      - name: Run component tests
        run: >-
          python -m pytest -q
          tests/test_guardian_flow_dsac_paper.py
          tests/test_guardian_dsac_v2_3.py
          tests/test_guardian_flow_dsac.py
          tests/test_flat_nmpc.py
          tests/test_drive_mgf_target.py
          tests/test_drive_mgf_geometry.py
          tests/test_metasafe_cbf_collection.py
